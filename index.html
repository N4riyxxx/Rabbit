<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 1st Anniversary</title>
    <!-- นำเข้าฟอนต์ Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Mali', 'Fredoka', cursive, sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #fdf0f4;
        }

        /* คลาสสำหรับซ่อนหน้าเว็บแบบเด็ดขาด */
        .screen-hidden {
            display: none !important;
        }

        /* ----------------------------------
           หน้า 1: หน้าแรก (รูปกระต่าย + ปุ่ม OPEN)
        ---------------------------------- */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #fdf0f4;
            z-index: 99;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .welcome-bg-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .open-btn {
            position: absolute;
            bottom: 8%; 
            left: 50%;                  
            transform: translateX(-50%); 
            padding: 12px 48px;
            font-size: 24px;
            font-weight: 700;
            color: #4A1525;
            background-color: #E2B5BD;
            border: 3px solid #4A1525;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s ease, background-color 0.2s ease;
            letter-spacing: 2px;
            white-space: nowrap;
            z-index: 2;
        }

        .open-btn:hover {
            transform: translateX(-50%) scale(1.08); 
            background-color: #D89EA9;
        }

        /* ----------------------------------
           หน้า 2: หน้าใส่รหัสผ่าน
        ---------------------------------- */
        #password-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('https://github.com/N4riyxxx/Rabbit/blob/main/363.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #fdf0f4;
            z-index: 88;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .back-to-welcome-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.85);
            border: 2px solid #4A1525;
            color: #4A1525;
            padding: 6px 16px;
            border-radius: 15px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .back-to-welcome-btn:hover {
            background-color: #E2B5BD;
        }

        .password-display-box {
            width: 320px;
            height: 54px;
            background-color: rgba(255, 255, 255, 0.85);
            border: 3px solid #4A1525;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            margin-bottom: 25px;
            backdrop-filter: blur(5px);
            position: relative;
        }

        .password-text-area {
            font-size: 20px;
            font-weight: 600;
            color: #4A1525;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-grow: 1;
        }

        .dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            background-color: #4A1525;
            border-radius: 50%;
            animation: popIn 0.2s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        .lock-icon {
            width: 22px;
            height: 22px;
            fill: #4A1525;
            position: absolute;
            right: 20px;
        }

        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            gap: 15px;
            justify-content: center;
        }

        .key-btn {
            width: 80px;
            height: 52px;
            background-color: rgba(255, 255, 255, 0.9);
            border: 3px solid #4A1525;
            border-radius: 20px;
            font-size: 22px;
            font-weight: 700;
            color: #4A1525;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.15s ease;
        }

        .key-btn:hover {
            background-color: #fce4eb;
            transform: translateY(-2px);
        }

        .col-2 { grid-column: 2; }
        .col-3 { grid-column: 3; }

        .shake {
            animation: shake 0.4s ease-in-out;
            border-color: #D9534F !important;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        /* ----------------------------------
           หน้า 3: หน้าแสดงคำอวยพร
        ---------------------------------- */
        #greeting-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('363.'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #fdf0f4;
            z-index: 77;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .anniversary-card {
            width: 100%;
            max-width: 650px;
            background-color: rgba(228, 203, 206, 0.92);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(74, 21, 37, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(3px);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background-color: rgba(215, 186, 190, 0.95);
            border-bottom: 1px solid rgba(74, 21, 37, 0.1);
        }

        .header-title {
            font-size: 24px;
            font-weight: 700;
            color: #4A1525;
        }

        .nav-btn {
            background: none;
            border: none;
            font-size: 22px;
            color: #4A1525;
            cursor: pointer;
            font-weight: bold;
        }

        .card-body {
            padding: 30px 35px;
            color: #4A1525;
            line-height: 1.8;
            font-size: 18px;
            font-weight: 500;
        }

        .next-page-btn {
            align-self: center;
            margin-top: 20px;
            padding: 10px 24px;
            font-size: 16px;
            font-weight: 700;
            color: #4A1525;
            background-color: #E2B5BD;
            border: 2px solid #4A1525;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .next-page-btn:hover {
            background-color: #D89EA9;
            transform: scale(1.05);
        }

        /* ----------------------------------
           หน้า 4: หน้าฟังเพลง
        ---------------------------------- */
        #music-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('363.'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #fdf0f4;
            z-index: 66;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .player-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            position: relative;
            max-width: 600px;
            width: 100%;
        }

        .vinyl-record {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, #3a2e2b 0%, #111111 25%, #2b2b2b 28%, #000000 70%);
            box-shadow: -8px 12px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: spin 10s linear infinite;
            animation-play-state: paused;
            z-index: 1;
            margin-right: -70px;
            flex-shrink: 0;
        }

        .vinyl-record::before {
            content: '';
            position: absolute;
            width: 275px;
            height: 275px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .vinyl-label {
            width: 100px;
            height: 100px;
            background-color: #EFA2B4;
            border-radius: 50%;
            border: 4px solid #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #5C2533;
            font-size: 10px;
            font-weight: 700;
            text-align: center;
            padding: 5px;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .music-player-card {
            width: 300px;
            background-color: #E8C3CC;
            border-radius: 24px;
            padding: 18px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }

        .photo-frame {
            width: 100%;
            height: 210px;
            border-radius: 16px;
            overflow: hidden;
            background-color: #fff;
            border: 4px solid #fff;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .progress-container {
            width: 100%;
            margin-top: 15px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background-color: #D1A3B0;
            border-radius: 10px;
            position: relative;
            cursor: pointer;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background-color: #5C2533;
            border-radius: 10px;
            position: relative;
            transition: width 0.1s linear;
        }

        .progress-bar-fill::after {
            content: '';
            position: absolute;
            right: -5px;
            top: -3px;
            width: 14px;
            height: 14px;
            background-color: #5C2533;
            border-radius: 50%;
        }

        .time-stamps {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 600;
            color: #5C2533;
            margin-top: 6px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-top: 10px;
            padding: 0 5px;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: #5C2533;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .ctrl-btn:hover {
            transform: scale(1.2);
        }

        .play-pause-btn {
            font-size: 24px;
            width: 36px;
            text-align: center;
        }

        @media (max-width: 580px) {
            .player-container {
                flex-direction: column;
                align-items: center;
            }

            .vinyl-record {
                margin-right: 0;
                margin-bottom: -60px;
                width: 220px;
                height: 220px;
            }

            .vinyl-record::before {
                width: 200px;
                height: 200px;
            }

            .music-player-card {
                width: 280px;
            }
        }
    </style>
</head>
<body>

    <!-- 1. หน้าแรก (แสดงแค่ภาพกระต่ายและปุ่ม OPEN) -->
    <div id="welcome-screen">
        <img src="663." alt="Welcome Rabbit" class="welcome-bg-img" onerror="this.style.display='none'">
        <button class="open-btn" onclick="goToPasswordPage()">OPEN</button>
    </div>

    <!-- 2. หน้าใส่รหัสผ่าน -->
    <div id="password-screen" class="screen-hidden">
        <button class="back-to-welcome-btn" onclick="backToWelcome()">← หน้าแรก</button>

        <div class="password-display-box" id="passwordBox">
            <div class="password-text-area" id="passDisplay">
                Enter Our Password
            </div>
            <svg class="lock-icon" viewBox="0 0 24 24">
                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
            </svg>
        </div>

        <div class="keypad-grid">
            <button class="key-btn" onclick="pressKey('1')">1</button>
            <button class="key-btn" onclick="pressKey('2')">2</button>
            <button class="key-btn" onclick="pressKey('3')">3</button>
            <button class="key-btn" onclick="pressKey('4')">4</button>
            <button class="key-btn" onclick="pressKey('5')">5</button>
            <button class="key-btn" onclick="pressKey('6')">6</button>
            <button class="key-btn" onclick="pressKey('7')">7</button>
            <button class="key-btn" onclick="pressKey('8')">8</button>
            <button class="key-btn" onclick="pressKey('9')">9</button>
            
            <button class="key-btn col-2" onclick="pressKey('0')">0</button>
            <button class="key-btn col-3" onclick="deleteKey()">⌫</button>
        </div>
    </div>

    <!-- 3. หน้าแสดงคำอวยพร -->
    <div id="greeting-screen" class="screen-hidden">
        <div class="anniversary-card">
            <div class="card-header">
                <button class="nav-btn" onclick="backToWelcome()">←</button>
                <div class="header-title">Happy 1st Anniversary 🫶</div>
                <button class="nav-btn" onclick="backToWelcome()">✕</button>
            </div>

            <div class="card-body">
                <p>สุขสันต์วันครบรอบ 1 ปีนะ ขอบคุณที่เข้ามาเป็นส่วนหนึ่งของชีวิต และอยู่เคียงข้างกันตลอดที่ผ่านมา ขอให้เราจับมือกันแบบนี้ไปเรื่อย ๆ นะคะ 🤍</p>
                <div style="text-align: center;">
                    <button class="next-page-btn" onclick="goToMusicPage()">ไปฟังเพลงกัน 🎵</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 4. หน้าฟังเพลง -->
    <div id="music-screen" class="screen-hidden">
        <div class="player-container">
            <div class="vinyl-record" id="vinyl">
                <div class="vinyl-label">
                    <span>OUR SONG</span>
                    <span style="font-size: 8px; margin-top: 3px;">THE ART OF LOVING</span>
                </div>
            </div>

            <div class="music-player-card">
                <div class="photo-frame">
                    <img src="couple.jpg" alt="Couple Picture" id="coupleImg">
                </div>

                <div class="progress-container">
                    <div class="progress-bar-bg" id="progressBarBg">
                        <div class="progress-bar-fill" id="progressFill"></div>
                    </div>
                    <div class="time-stamps">
                        <span id="currentTime">0:00</span>
                        <span id="duration">0:00</span>
                    </div>
                </div>

                <div class="controls">
                    <button class="ctrl-btn">🔀</button>
                    <button class="ctrl-btn" onclick="restartAudio()">⏮</button>
                    <button class="ctrl-btn play-pause-btn" id="playPauseBtn" onclick="togglePlay()">▶</button>
                    <button class="ctrl-btn">⏭</button>
                    <button class="ctrl-btn">🔁</button>
                </div>
            </div>
        </div>

        <audio id="myAudio" loop>
            <source src="song.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
        const CORRECT_PASSWORD = "1234"; 
        let currentInput = "";
        
        const audio = document.getElementById('myAudio');
        const vinyl = document.getElementById('vinyl');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const progressBarBg = document.getElementById('progressBarBg');

        /* ------------ ระบบเปลี่ยนหน้า (ควบคุมการแสดง/ซ่อน) ------------ */
        function goToPasswordPage() {
            document.getElementById('welcome-screen').classList.add('screen-hidden');
            document.getElementById('password-screen').classList.remove('screen-hidden');
        }

        function backToWelcome() {
            document.getElementById('welcome-screen').classList.remove('screen-hidden');
            document.getElementById('password-screen').classList.add('screen-hidden');
            document.getElementById('greeting-screen').classList.add('screen-hidden');
            document.getElementById('music-screen').classList.add('screen-hidden');
            currentInput = "";
            updateDisplay();
        }

        function pressKey(num) {
            if (currentInput.length < 4) {
                currentInput += num;
                updateDisplay();

                if (currentInput.length === 4) {
                    setTimeout(checkPassword, 200);
                }
            }
        }

        function deleteKey() {
            if (currentInput.length > 0) {
                currentInput = currentInput.slice(0, -1);
                updateDisplay();
            }
        }

        function updateDisplay() {
            const displayArea = document.getElementById('passDisplay');
            if (currentInput.length === 0) {
                displayArea.innerHTML = 'Enter Our Password';
            } else {
                let dotsHtml = '';
                for (let i = 0; i < currentInput.length; i++) {
                    dotsHtml += '<span class="dot"></span>';
                }
                displayArea.innerHTML = dotsHtml;
            }
        }

        function checkPassword() {
            const passwordBox = document.getElementById('passwordBox');
            if (currentInput === CORRECT_PASSWORD) {
                document.getElementById('password-screen').classList.add('screen-hidden');
                document.getElementById('greeting-screen').classList.remove('screen-hidden');
            } else {
                passwordBox.classList.add('shake');
                setTimeout(() => {
                    passwordBox.classList.remove('shake');
                    currentInput = "";
                    updateDisplay();
                }, 500);
            }
        }

        function goToMusicPage() {
            document.getElementById('greeting-screen').classList.add('screen-hidden');
            document.getElementById('music-screen').classList.remove('screen-hidden');
            playAudio();
        }

        /* ------------ ระบบเครื่องเล่นเพลง ------------ */
        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function playAudio() {
            audio.play().then(() => {
                vinyl.style.animationPlayState = 'running';
                playPauseBtn.innerHTML = '❚❚';
            }).catch(e => {
                console.log("Autoplay blocked:", e);
                vinyl.style.animationPlayState = 'paused';
                playPauseBtn.innerHTML = '▶';
            });
        }

        function togglePlay() {
            if (audio.paused) {
                playAudio();
            } else {
                audio.pause();
                vinyl.style.animationPlayState = 'paused';
                playPauseBtn.innerHTML = '▶';
            }
        }

        function restartAudio() {
            audio.currentTime = 0;
            if (audio.paused) playAudio();
        }

        audio.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('timeupdate', () => {
            if (!audio.duration) return;
            const pct = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = pct + '%';
            currentTimeEl.textContent = formatTime(audio.currentTime);
            
            const remaining = audio.duration - audio.currentTime;
            durationEl.textContent = '-' + formatTime(remaining);
        });

        progressBarBg.addEventListener('click', (e) => {
            const rect = progressBarBg.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const width = rect.width;
            if (audio.duration) {
                audio.currentTime = (clickX / width) * audio.duration;
            }
        });
    </script>
</body>
</html>
